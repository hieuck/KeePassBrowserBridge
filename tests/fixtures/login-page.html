<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeePassBrowserBridge Login Fixture</title>
  <style>
    body {
      margin: 0;
      background: #f4f6f8;
      color: #1f2933;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(420px, calc(100vw - 32px));
      margin: 48px auto;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d7dde5;
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #667085;
      font-weight: 600;
    }

    input,
    button {
      width: 100%;
      min-height: 36px;
      box-sizing: border-box;
      font: inherit;
    }

    input {
      border: 1px solid #cfd6df;
      border-radius: 6px;
      padding: 0 10px;
    }

    button {
      margin-top: 16px;
      border: 0;
      border-radius: 6px;
      background: #176b87;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Login Fixture</h1>
    <form>
      <label for="username">Username</label>
      <input id="username" name="username" type="email" autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">

      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
