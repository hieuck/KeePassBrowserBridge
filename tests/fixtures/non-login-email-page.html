<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Marketing Signup</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    label { display: grid; gap: 6px; max-width: 320px; }
    input { height: 34px; padding: 0 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Product updates</h1>
    <form id="newsletter">
      <label>
        Subscribe to newsletter
        <input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="Email address">
      </label>
      <button type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
