<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password reset fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    form { display: grid; gap: 12px; max-width: 420px; }
    label { display: grid; gap: 6px; }
    input { height: 34px; padding: 0 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <form id="password-reset">
      <p>Enter your email address and we will send a recovery link.</p>
      <label>
        Email address
        <input id="reset-email" name="email" type="email" autocomplete="email">
      </label>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
