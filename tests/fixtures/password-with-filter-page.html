<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password With Filter Fixture</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 32px; }
    section { margin-bottom: 28px; }
    label { display: block; margin: 12px 0; }
    input { min-height: 32px; min-width: 240px; }
  </style>
</head>
<body>
  <section aria-label="Account table">
    <h1>Team accounts</h1>
    <label>
      Filter by email or name
      <input id="account-filter" name="emailFilter" type="text" placeholder="Filter by email or name">
    </label>
  </section>

  <form id="password-only-login" action="/signed-in" method="post">
    <h2>Confirm password</h2>
    <label>
      Password
      <input id="password-only" name="password" type="password" autocomplete="current-password">
    </label>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
