<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phone username-first fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    form { display: grid; gap: 12px; max-width: 420px; }
    label { display: grid; gap: 6px; }
    input { height: 34px; padding: 0 10px; }
  </style>
</head>
<body>
  <main>
    <form id="phone-first-login" action="/tests/fixtures/multi-step-password.html" method="get">
      <h1>Sign in</h1>
      <label>
        Phone number
        <input id="phone-identifier" name="phone" type="tel" autocomplete="tel">
      </label>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
