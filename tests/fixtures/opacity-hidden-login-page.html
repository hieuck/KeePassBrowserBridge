<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opacity hidden login fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    form { display: grid; gap: 12px; max-width: 420px; margin-bottom: 24px; }
    label { display: grid; gap: 6px; }
    input { height: 34px; padding: 0 10px; }
    #hidden-login { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <form id="hidden-login" aria-hidden="true">
      <label>
        Hidden username
        <input id="hidden-username" name="username" type="email" autocomplete="username">
      </label>
      <label>
        Hidden password
        <input id="hidden-password" name="password" type="password" autocomplete="current-password">
      </label>
    </form>

    <form id="visible-login">
      <h1>Sign in</h1>
      <label>
        Email
        <input id="visible-username" name="email" type="email" autocomplete="username">
      </label>
      <label>
        Password
        <input id="visible-password" name="password" type="password" autocomplete="current-password">
      </label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
