<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password Step</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    label { display: grid; gap: 6px; max-width: 320px; }
    input { height: 34px; padding: 0 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Enter password</h1>
    <form id="password-step">
      <label>
        Password
        <input id="step-password" name="password" type="password" autocomplete="current-password">
      </label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
