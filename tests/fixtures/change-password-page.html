<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Change password fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    form { display: grid; gap: 12px; max-width: 420px; }
    label { display: grid; gap: 6px; }
    input { height: 34px; padding: 0 10px; }
  </style>
</head>
<body>
  <main>
    <form id="change-password">
      <h1>Change password</h1>
      <label>
        Email
        <input id="account-email" name="email" type="email" autocomplete="username">
      </label>
      <label>
        Current password
        <input id="current-password" name="current_password" type="password" autocomplete="current-password">
      </label>
      <label>
        New password
        <input id="new-password" name="new_password" type="password" autocomplete="new-password">
      </label>
      <label>
        Confirm new password
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password">
      </label>
      <button type="submit">Update password</button>
    </form>
  </main>
</body>
</html>
