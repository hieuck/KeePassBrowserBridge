<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email address login</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    label { display: grid; gap: 6px; max-width: 320px; }
    input { height: 34px; padding: 0 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="email-step">
      <label>
        Email address
        <input id="email-address-login" name="email" type="email" autocomplete="username">
      </label>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
