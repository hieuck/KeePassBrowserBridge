<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search and login fixture</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 32px; }
    form, section { margin-bottom: 24px; }
    label { display: grid; gap: 6px; max-width: 320px; margin: 10px 0; }
    input { min-height: 32px; padding: 0 10px; }
  </style>
</head>
<body>
  <section>
    <h1>Activity</h1>
    <label>
      Search
      <input id="activity-search" name="query" type="search" autocomplete="off">
    </label>
  </section>

  <form id="login-form">
    <h2>Sign in</h2>
    <label>
      Email
      <input id="login-username" name="email" type="email" autocomplete="username">
    </label>
    <label>
      Password
      <input id="login-password" name="password" type="password" autocomplete="current-password">
    </label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
