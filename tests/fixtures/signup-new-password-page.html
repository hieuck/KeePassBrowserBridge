<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create account fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    form { display: grid; gap: 12px; max-width: 420px; }
    label { display: grid; gap: 6px; }
    input { height: 34px; padding: 0 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Create account</h1>
    <form id="signup">
      <label>
        Email
        <input id="signup-email" name="email" type="email" autocomplete="email">
      </label>
      <label>
        New password
        <input id="signup-password" name="password" type="password" autocomplete="new-password">
      </label>
      <label>
        Confirm password
        <input id="signup-password-confirm" name="password_confirm" type="password" autocomplete="new-password">
      </label>
      <button type="submit">Create account</button>
    </form>
  </main>
</body>
</html>
