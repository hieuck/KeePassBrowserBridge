name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      keepass_version:
        description: KeePass 2.x version used to build the plugin
        required: true
        default: 2.61.1
        type: string
      sign_release:
        description: Create GPG detached signatures for release assets
        required: false
        default: false
        type: boolean
      gpg_key_id:
        description: Optional GPG key ID to use when signing
        required: false
        default: ""
        type: string
      expected_gpg_fingerprint:
        description: Optional full maintainer GPG fingerprint required for signature verification
        required: false
        default: ""
        type: string

env:
  RELEASE_VERSION: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    name: Package plugin and extension
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Validate release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseVersion = "${{ env.RELEASE_VERSION }}"
          if ([string]::IsNullOrWhiteSpace($releaseVersion)) {
            $tag = "${{ github.ref_name }}"
            $releaseVersion = $tag -replace '^v', ''
          }
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use x.y.z format. Got: $releaseVersion"
          }
          echo "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV

          $manifest = Get-Content -Raw extension\manifest.json | ConvertFrom-Json
          if ([string] $manifest.version -ne $releaseVersion) {
            throw "Release version $releaseVersion does not match extension/manifest.json version $($manifest.version)."
          }

      - name: Install Playwright browsers
        shell: pwsh
        run: npx playwright install chromium firefox

      - name: Download KeePass
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $keepassVersion = "${{ inputs.keepass_version }}"
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$keepassVersion/KeePass-$keepassVersion.zip"
          $keepassRoot = Join-Path $env:RUNNER_TEMP "KeePassBrowserBridge-KeePass"
          $zipPath = Join-Path $keepassRoot "KeePass.zip"
          $extractPath = Join-Path $keepassRoot "KeePass"
          New-Item -ItemType Directory -Force -Path $keepassRoot | Out-Null
          curl.exe --location --fail --retry 5 --retry-delay 5 --output $zipPath $url
          if ($LASTEXITCODE -ne 0) {
            throw "KeePass download failed with exit code $LASTEXITCODE."
          }
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path $zipPath))[0..1]
          if ($header[0] -ne 0x50 -or $header[1] -ne 0x4B) {
            throw "Downloaded KeePass file is not a ZIP archive."
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

      - name: Verify
        shell: pwsh
        run: .\scripts\verify.ps1 -KeePassExe "$env:RUNNER_TEMP\KeePassBrowserBridge-KeePass\KeePass\KeePass.exe" -E2EProjects chromium,firefox

      - name: Import GPG signing key
        if: ${{ inputs.sign_release }}
        shell: pwsh
        env:
          KBB_GPG_PRIVATE_KEY: ${{ secrets.KBB_GPG_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:KBB_GPG_PRIVATE_KEY)) {
            throw "sign_release was requested, but KBB_GPG_PRIVATE_KEY is not configured."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "kbb-release-key.asc"
          [System.IO.File]::WriteAllText($keyPath, $env:KBB_GPG_PRIVATE_KEY)
          gpg --batch --import $keyPath

      - name: Build release artifacts
        shell: pwsh
        run: |
          $buildArgs = @(
            "-KeePassExe", "$env:RUNNER_TEMP\KeePassBrowserBridge-KeePass\KeePass\KeePass.exe",
            "-ArtifactsDir", "${{ github.workspace }}\artifacts",
            "-RequireCleanSource"
          )
          if ("${{ inputs.sign_release }}" -eq "true") {
            $buildArgs += "-SignArtifacts"
            $gpgKeyId = "${{ inputs.gpg_key_id }}"
            if (-not [string]::IsNullOrWhiteSpace($gpgKeyId)) {
              $buildArgs += @("-GpgKeyId", $gpgKeyId)
            }
          }
          .\scripts\build-release.ps1 @buildArgs

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $verifyArgs = @(
            "-ArtifactsDir", "${{ github.workspace }}\artifacts",
            "-Version", "${{ env.RELEASE_VERSION }}"
          )
          if ("${{ inputs.sign_release }}" -eq "true") {
            $verifyArgs += "-RequireSignatures"
            $fingerprint = "${{ inputs.expected_gpg_fingerprint }}"
            if (-not [string]::IsNullOrWhiteSpace($fingerprint)) {
              $verifyArgs += @("-ExpectedSignerFingerprint", $fingerprint)
            }
          }
          .\scripts\verify-release-artifacts.ps1 @verifyArgs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: KeePass Browser Bridge ${{ env.RELEASE_VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/KeePassBrowserBridge.dll
            artifacts/KeePassBrowserBridge.plgx
            artifacts/KeePassBrowserBridge-chrome-extension-${{ env.RELEASE_VERSION }}.zip
            artifacts/KeePassBrowserBridge-firefox-extension-${{ env.RELEASE_VERSION }}.zip
            artifacts/versioninfo.txt
            artifacts/release-manifest.json
            artifacts/SHA256SUMS.txt
            artifacts/*.asc

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-plugin-dll-${{ env.RELEASE_VERSION }}
          path: artifacts\KeePassBrowserBridge.dll

      - name: Upload plugin PLGX
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-plugin-plgx-${{ env.RELEASE_VERSION }}
          path: artifacts\KeePassBrowserBridge.plgx

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-chrome-extension-${{ env.RELEASE_VERSION }}
          path: artifacts\KeePassBrowserBridge-chrome-extension-${{ env.RELEASE_VERSION }}.zip

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-firefox-extension-${{ env.RELEASE_VERSION }}
          path: artifacts\KeePassBrowserBridge-firefox-extension-${{ env.RELEASE_VERSION }}.zip

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-release-${{ env.RELEASE_VERSION }}
          path: artifacts\*
