name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      keepass_version:
        description: KeePass 2.x version used to build the plugin
        required: true
        default: 2.61.1
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package plugin and extension
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Install Playwright Chromium
        shell: pwsh
        run: npx playwright install chromium

      - name: Download KeePass
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $keepassVersion = "${{ inputs.keepass_version }}"
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$keepassVersion/KeePass-$keepassVersion.zip"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          curl.exe --location --fail --retry 5 --retry-delay 5 --output tools\KeePass.zip $url
          if ($LASTEXITCODE -ne 0) {
            throw "KeePass download failed with exit code $LASTEXITCODE."
          }
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path tools\KeePass.zip))[0..1]
          if ($header[0] -ne 0x50 -or $header[1] -ne 0x4B) {
            throw "Downloaded KeePass file is not a ZIP archive."
          }
          Expand-Archive -Path tools\KeePass.zip -DestinationPath tools\KeePass -Force

      - name: Verify
        shell: pwsh
        run: .\scripts\verify.ps1 -KeePassExe "${{ github.workspace }}\tools\KeePass\KeePass.exe"

      - name: Build release artifacts
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 `
            -KeePassExe "${{ github.workspace }}\tools\KeePass\KeePass.exe" `
            -ArtifactsDir "${{ github.workspace }}\artifacts"

      - name: Verify requested version
        shell: pwsh
        run: |
          $expected = "${{ inputs.version }}"
          $chromeExtension = "artifacts\KeePassBrowserBridge-chrome-extension-$expected.zip"
          $firefoxExtension = "artifacts\KeePassBrowserBridge-firefox-extension-$expected.zip"
          foreach ($extension in @($chromeExtension, $firefoxExtension)) {
            if (-not (Test-Path -LiteralPath $extension)) {
              throw "Expected extension artifact was not created: $extension"
            }
          }
          foreach ($path in @("artifacts\KeePassBrowserBridge.dll", "artifacts\KeePassBrowserBridge.plgx", $chromeExtension, $firefoxExtension)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing release artifact: $path"
            }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: KeePass Browser Bridge ${{ inputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/KeePassBrowserBridge.dll
            artifacts/KeePassBrowserBridge.plgx
            artifacts/KeePassBrowserBridge-chrome-extension-${{ inputs.version }}.zip
            artifacts/KeePassBrowserBridge-firefox-extension-${{ inputs.version }}.zip
            artifacts/versioninfo.txt

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-plugin-dll-${{ inputs.version }}
          path: artifacts\KeePassBrowserBridge.dll

      - name: Upload plugin PLGX
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-plugin-plgx-${{ inputs.version }}
          path: artifacts\KeePassBrowserBridge.plgx

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-chrome-extension-${{ inputs.version }}
          path: artifacts\KeePassBrowserBridge-chrome-extension-${{ inputs.version }}.zip

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-firefox-extension-${{ inputs.version }}
          path: artifacts\KeePassBrowserBridge-firefox-extension-${{ inputs.version }}.zip

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-release-${{ inputs.version }}
          path: artifacts\*
