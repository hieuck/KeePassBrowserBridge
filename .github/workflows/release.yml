name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      keepass_version:
        description: KeePass 2.x version used to build the plugin
        required: true
        default: 2.61.1
        type: string
      sign_release:
        description: Create GPG detached signatures for release assets
        required: false
        default: false
        type: boolean
      gpg_key_id:
        description: Optional GPG key ID to use when signing
        required: false
        default: ""
        type: string
      expected_gpg_fingerprint:
        description: Optional full maintainer GPG fingerprint required for signature verification
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package plugin and extension
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Validate release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "push") {
            $releaseVersion = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $releaseVersion = "${{ inputs.version }}"
          }
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use x.y.z format. Got: $releaseVersion"
          }
          echo "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV

          $manifest = Get-Content -Raw extension\manifest.json | ConvertFrom-Json
          if ([string] $manifest.version -ne $releaseVersion) {
            throw "Release version $releaseVersion does not match extension/manifest.json version $($manifest.version)."
          }

      - name: Download KeePass
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $keepassVersion = "${{ inputs.keepass_version }}"
          if ([string]::IsNullOrWhiteSpace($keepassVersion)) { $keepassVersion = "2.61.1" }
          $keepassDir = Join-Path $env:RUNNER_TEMP "KeePass"
          $zipPath = Join-Path $keepassDir "KeePass.zip"
          New-Item -ItemType Directory -Force -Path $keepassDir | Out-Null
          $url = "https://sourceforge.net/projects/keepass/files/KeePass%202.x/$keepassVersion/KeePass-$keepassVersion.zip/download"
          for ($i = 0; $i -lt 10; $i++) {
            $result = curl.exe -L --connect-timeout 30 --max-time 120 -o $zipPath $url 2>&1
            if ($LASTEXITCODE -eq 0) {
              $header = [System.IO.File]::ReadAllBytes($zipPath)[0..1]
              if ($header[0] -eq 0x50 -and $header[1] -eq 0x4B) {
                Expand-Archive -Path $zipPath -DestinationPath $keepassDir -Force
                echo "KEEPASS_DOWNLOADED=true" >> $env:GITHUB_ENV
                Write-Output "KeePass $keepassVersion downloaded OK"
                return
              }
            }
            Write-Warning "Attempt $($i+1)/10 failed. Retrying..."
            Start-Sleep 10
          }
          Write-Warning "KeePass download failed after 10 attempts. Plugin will not be built."

      - name: Verify
        shell: pwsh
        run: npm test

      - name: Import GPG signing key
        if: ${{ inputs.sign_release }}
        shell: pwsh
        env:
          KBB_GPG_PRIVATE_KEY: ${{ secrets.KBB_GPG_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:KBB_GPG_PRIVATE_KEY)) {
            throw "sign_release was requested, but KBB_GPG_PRIVATE_KEY is not configured."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "kbb-release-key.asc"
          [System.IO.File]::WriteAllText($keyPath, $env:KBB_GPG_PRIVATE_KEY)
          gpg --batch --import $keyPath

      - name: Build plugin
        if: ${{ env.KEEPASS_DOWNLOADED == 'true' }}
        shell: pwsh
        run: |
          $keepassDir = Join-Path $env:RUNNER_TEMP "KeePass"
          .\scripts\build-release.ps1 -KeePassExe "$keepassDir\KeePass.exe" -ArtifactsDir "${{ github.workspace }}\artifacts" -RequireCleanSource

      - name: Build extension
        shell: pwsh
        run: |
          Set-Location extension
          npx vite build
          npx vite build --config vite.web-components.config.js
          Set-Location ..
          if (-not (Test-Path "artifacts")) { New-Item -ItemType Directory -Force -Path artifacts | Out-Null }
          Compress-Archive -Path "extension\dist\*" -DestinationPath "artifacts\extension-dist-${{ env.RELEASE_VERSION }}.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: KeePass Browser Bridge ${{ env.RELEASE_VERSION }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/*

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-release-${{ env.RELEASE_VERSION }}
          path: artifacts\*
