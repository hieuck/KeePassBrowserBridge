name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: windows-latest
    env:
      KEEPASS_VERSION: 2.61.1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check extension JavaScript
        shell: pwsh
        run: |
          node --check extension\background.js
          node --check extension\contentScript.js
          node --check extension\popup.js
          node tests\extension\background.test.mjs
          node tests\extension\protocol.test.mjs
          node tests\extension\content-script.test.mjs
          node tests\extension\popup.test.mjs

      - name: Download KeePass
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$env:KEEPASS_VERSION/KeePass-$env:KEEPASS_VERSION.zip"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          curl.exe --location --fail --retry 5 --retry-delay 5 --output tools\KeePass.zip $url
          if ($LASTEXITCODE -ne 0) {
            throw "KeePass download failed with exit code $LASTEXITCODE."
          }
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path tools\KeePass.zip))[0..1]
          if ($header[0] -ne 0x50 -or $header[1] -ne 0x4B) {
            throw "Downloaded KeePass file is not a ZIP archive."
          }
          Expand-Archive -Path tools\KeePass.zip -DestinationPath tools\KeePass -Force

      - name: Run bridge tests
        shell: pwsh
        run: dotnet run --project tests\KeePassBrowserBridge.Tests.csproj -p:KeePassExe="${{ github.workspace }}\tools\KeePass\KeePass.exe"

      - name: Package browser extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $chromeStage = "artifacts\chrome-extension"
          $firefoxStage = "artifacts\firefox-extension"
          foreach ($stage in @($chromeStage, $firefoxStage)) {
            if (Test-Path -LiteralPath $stage) {
              Remove-Item -LiteralPath $stage -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
          }
          foreach ($item in Get-ChildItem -LiteralPath extension -Force | Where-Object { $_.Name -notin @("manifest.firefox.json") }) {
            Copy-Item -LiteralPath $item.FullName -Destination $chromeStage -Recurse -Force
            Copy-Item -LiteralPath $item.FullName -Destination $firefoxStage -Recurse -Force
          }
          Copy-Item -LiteralPath extension\manifest.firefox.json -Destination "$firefoxStage\manifest.json" -Force
          Compress-Archive -Path (Get-ChildItem -LiteralPath $chromeStage -Force).FullName -DestinationPath artifacts\KeePassBrowserBridge-chrome-extension-ci.zip -Force
          Compress-Archive -Path (Get-ChildItem -LiteralPath $firefoxStage -Force).FullName -DestinationPath artifacts\KeePassBrowserBridge-firefox-extension-ci.zip -Force
