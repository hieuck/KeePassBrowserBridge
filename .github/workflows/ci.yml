name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: windows-latest
    env:
      KEEPASS_VERSION: 2.61.1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Install Playwright Chromium
        shell: pwsh
        run: npx playwright install chromium

      - name: Download KeePass
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$env:KEEPASS_VERSION/KeePass-$env:KEEPASS_VERSION.zip"
          $keepassRoot = Join-Path $env:RUNNER_TEMP "KeePassBrowserBridge-KeePass"
          $zipPath = Join-Path $keepassRoot "KeePass.zip"
          $extractPath = Join-Path $keepassRoot "KeePass"
          New-Item -ItemType Directory -Force -Path $keepassRoot | Out-Null
          curl.exe --location --fail --retry 5 --retry-delay 5 --output $zipPath $url
          if ($LASTEXITCODE -ne 0) {
            throw "KeePass download failed with exit code $LASTEXITCODE."
          }
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path $zipPath))[0..1]
          if ($header[0] -ne 0x50 -or $header[1] -ne 0x4B) {
            throw "Downloaded KeePass file is not a ZIP archive."
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

      - name: Verify
        shell: pwsh
        run: .\scripts\verify.ps1 -KeePassExe "$env:RUNNER_TEMP\KeePassBrowserBridge-KeePass\KeePass\KeePass.exe"

      - name: Build release artifacts
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 `
            -KeePassExe "$env:RUNNER_TEMP\KeePassBrowserBridge-KeePass\KeePass\KeePass.exe" `
            -ArtifactsDir "${{ github.workspace }}\artifacts" `
            -RequireCleanSource

      - name: Verify release artifacts
        shell: pwsh
        run: |
          .\scripts\verify-release-artifacts.ps1 `
            -ArtifactsDir "${{ github.workspace }}\artifacts"

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: KeePassBrowserBridge-ci-release-artifacts
          path: artifacts\*
