name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '8.0.x'
  KEEPASS_VERSION: '2.61.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: npm ci --legacy-peer-deps --legacy-peer-deps
      - run: npm run lint

  unit:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: npm ci --legacy-peer-deps
      - run: npm test

  coverage:
    name: Coverage check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: npm ci --legacy-peer-deps
      - run: npm run test:coverage:ci

  dotnet:
    name: .NET build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Download KeePass
        shell: pwsh
        continue-on-error: true
        run: |
          $keepassDir = Join-Path $env:RUNNER_TEMP "KeePass"
          New-Item -ItemType Directory -Force -Path $keepassDir | Out-Null
          $url = "https://sourceforge.net/projects/keepass/files/KeePass%202.x/${{ env.KEEPASS_VERSION }}/KeePass-${{ env.KEEPASS_VERSION }}.zip/download"
          $zipPath = Join-Path $keepassDir "KeePass.zip"
          for ($i = 0; $i -lt 5; $i++) {
            curl.exe -L --connect-timeout 30 --max-time 120 -o $zipPath $url 2>&1
            if ($LASTEXITCODE -eq 0) {
              $header = [System.IO.File]::ReadAllBytes($zipPath)[0..1]
              if ($header[0] -eq 0x50 -and $header[1] -eq 0x4B) {
                Expand-Archive -Path $zipPath -DestinationPath $keepassDir -Force
                $kpExe = Get-ChildItem -Path $keepassDir -Recurse -Filter "KeePass.exe" | Select-Object -First 1 -ExpandProperty FullName
                if ($kpExe) { $keepassDir = Split-Path $kpExe -Parent }
                echo "KEEPASS_DIR=$keepassDir" >> $env:GITHUB_ENV
                return
              }
            }
            Start-Sleep 5
          }
          Write-Warning "KeePass download failed after 5 attempts."
      - name: Build plugin
        run: |
          if (Test-Path "$env:KEEPASS_DIR\KeePass.exe") {
            dotnet build src/KeePassBrowserBridge.csproj /p:KeePassReferencePath="$env:KEEPASS_DIR"
          } else {
            Write-Warning "KeePass not available. Skipping plugin build."
          }

  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: windows-latest
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, msedge, webkit]
    env:
      PW_SNAPSHOT_UPDATE: ${{ vars.UPDATE_SNAPSHOTS || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright
        run: npx playwright install ${{ matrix.browser }} --with-deps
      - name: Build extension
        run: npm run build:all
      - name: Start dev server
        run: Start-Job -ScriptBlock { node "$env:GITHUB_WORKSPACE/tests/e2e/server.mjs" }; Start-Sleep 3
        shell: pwsh
      - name: E2E tests
        run: npx playwright test tests/e2e/user-journey.spec.js tests/e2e/edit-flow.spec.js tests/accessibility/ tests/e2e/end-user-audit.spec.js --project=${{ matrix.browser }} --reporter=line

      - name: Visual regression tests
        if: matrix.browser == 'chromium'
        run: npx playwright test tests/visual/ --project=chromium --reporter=line

  csharp-tests:
    name: C# bridge tests
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Download KeePass
        shell: pwsh
        continue-on-error: true
        run: |
          $keepassDir = Join-Path $env:RUNNER_TEMP "KeePass"
          New-Item -ItemType Directory -Force -Path $keepassDir | Out-Null
          # Try SourceForge first, then GitHub release asset as fallback
          $urls = @(
            "https://sourceforge.net/projects/keepass/files/KeePass%202.x/${{ env.KEEPASS_VERSION }}/KeePass-${{ env.KEEPASS_VERSION }}.zip/download"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            $zipPath = Join-Path $keepassDir "KeePass.zip"
            for ($i = 0; $i -lt 5; $i++) {
              curl.exe -L --connect-timeout 30 --max-time 120 -o $zipPath $url 2>&1
              if ($LASTEXITCODE -eq 0) {
                $header = [System.IO.File]::ReadAllBytes($zipPath)[0..1]
                if ($header[0] -eq 0x50 -and $header[1] -eq 0x4B) {
                  Expand-Archive -Path $zipPath -DestinationPath $keepassDir -Force
                  $kpExe = Get-ChildItem -Path $keepassDir -Recurse -Filter "KeePass.exe" | Select-Object -First 1 -ExpandProperty FullName
                  if ($kpExe) { $keepassDir = Split-Path $kpExe -Parent }
                  echo "KEEPASS_DIR=$keepassDir" >> $env:GITHUB_ENV
                  Write-Output "KeePass downloaded OK at $keepassDir"
                  $downloaded = $true
                  return
                }
              }
              Start-Sleep 5
            }
          }
          if (-not $downloaded) { Write-Warning "KeePass download failed. C# tests will be skipped." }
      - name: Build test project
        run: |
          if (Test-Path "$env:KEEPASS_DIR\KeePass.exe") {
            dotnet build tests/KeePassBrowserBridge.Tests.csproj /p:KeePassExe="$env:KEEPASS_DIR\KeePass.exe"
          } else {
            Write-Warning "KeePass not available. Skipping C# build."
          }
      - name: Run bridge tests
        run: |
          if (Test-Path "$env:KEEPASS_DIR\KeePass.exe") {
            dotnet run --project tests/KeePassBrowserBridge.Tests.csproj /p:KeePassExe="$env:KEEPASS_DIR\KeePass.exe"
          } else {
            Write-Warning "KeePass not available. Skipping C# tests."
          }

  bundle-size:
    name: Bundle size
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --legacy-peer-deps
      - name: Build extension
        run: |
          Set-Location extension
          npx vite build
          npx vite build --config vite.web-components.config.js
      - name: Check bundle sizes
        run: node scripts/check-bundle-size.mjs

  verify:
    name: Full verification
    needs: [unit, coverage, bundle-size, dotnet, e2e, csharp-tests]
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright
        run: npx playwright install chromium firefox --with-deps
      - name: Build extension
        run: npm run build:all
      - name: Download KeePass
        shell: pwsh
        run: |
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$env:KEEPASS_VERSION/KeePass-$env:KEEPASS_VERSION.zip"
          $keepassRoot = Join-Path $env:RUNNER_TEMP "KeePassBrowserBridge-KeePass"
          $zipPath = Join-Path $keepassRoot "KeePass.zip"
          $extractPath = Join-Path $keepassRoot "KeePass"
          New-Item -ItemType Directory -Force -Path $keepassRoot | Out-Null
          curl.exe --location --fail --retry 5 --retry-delay 5 --output $zipPath $url
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
      - name: Full verify
        run: .\scripts\verify.ps1 -KeePassExe "$env:RUNNER_TEMP\KeePassBrowserBridge-KeePass\KeePass\KeePass.exe" -E2EProjects chromium,firefox
      - name: Build release artifacts
        run: .\scripts\build-release.ps1 -KeePassExe "$env:RUNNER_TEMP\KeePassBrowserBridge-KeePass\KeePass\KeePass.exe" -ArtifactsDir "${{ github.workspace }}\artifacts" -RequireCleanSource
      - name: Verify release artifacts
        run: .\scripts\verify-release-artifacts.ps1 -ArtifactsDir "${{ github.workspace }}\artifacts"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts\*
