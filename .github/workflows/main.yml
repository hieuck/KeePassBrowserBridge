name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Build release artifacts'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'

jobs:
  test-js:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Unit tests
        run: npm test
        continue-on-error: true
      - name: E2E tests
        run: npx playwright test --project=chromium --reporter=line
        continue-on-error: true

  build:
    runs-on: windows-latest
    needs: test-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build:all
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: extension/dist/

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build release
        shell: powershell
        run: ./scripts/build-release.ps1 -RequireCleanSource
        continue-on-error: true
      - name: Verify artifacts
        shell: powershell
        run: ./scripts/verify-release-artifacts.ps1
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/KeePassBrowserBridge-artifacts/*
