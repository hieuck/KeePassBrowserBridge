name: Kimchi Weekly Retrospective

on:
  # Run every Sunday at 18:00 UTC. Adjust as needed.
  schedule:
    - cron: '0 18 * * 0'

  # Allow manual trigger.
  workflow_dispatch:

jobs:
  kimchi-retrospective:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify autonomy opt-in
        run: |
          if [ ! -f .kimchi/AUTONOMY.md ]; then
            echo "No .kimchi/AUTONOMY.md found. Skipping retrospective."
            exit 0
          fi
          echo "Autonomy config present. Continuing."

      # --- Replace the step below with your actual Kimchi runner ---
      - name: Run Kimchi retrospective
        env:
          KIMCHI_FULL_AUTONOMY: 1
          KIMCHI_AUTONOMY_CONFIG: .kimchi/AUTONOMY.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Replace this command with your Kimchi retrospective runner invocation."
          echo "Example: kimchi run --mode retrospective --repo ."
          # Placeholder exit to keep the workflow green until configured.
          exit 0

      - name: Upload retrospective logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-retrospective-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .kimchi/logs/*.md
            .kimchi/retrospectives/*.md
          if-no-files-found: ignore
