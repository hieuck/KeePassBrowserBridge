name: Kimchi Weekly Retrospective

on:
  # Run every Sunday at 18:00 UTC. Adjust as needed.
  schedule:
    - cron: '0 18 * * 0'

  # Allow manual trigger.
  workflow_dispatch:

jobs:
  kimchi-retrospective:
    runs-on: ubuntu-latest
    # Minimal permissions for placeholder runner; expand once real Kimchi runner is wired.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect repository context
        id: repo
        run: |
          echo "repo_name=$(basename "$(git rev-parse --show-toplevel)")" >> "$GITHUB_OUTPUT"
          echo "default_branch=$(git symbolic-ref refs/remotes/origin/HEAD --short 2>/dev/null | sed 's/origin\///')" >> "$GITHUB_OUTPUT"
          echo "repo_url=$(git remote get-url origin 2>/dev/null)" >> "$GITHUB_OUTPUT"


      - name: Verify autonomy opt-in
        run: |
          if [ ! -f .kimchi/AUTONOMY.md ]; then
            echo "No .kimchi/AUTONOMY.md found. Skipping retrospective."
            exit 0
          fi
          echo "Autonomy config present. Continuing."

      # --- Replace the step below with your actual Kimchi runner ---
      - name: Run Kimchi retrospective
        env:
          KIMCHI_FULL_AUTONOMY: 1
          KIMCHI_AUTONOMY_CONFIG: .kimchi/AUTONOMY.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ steps.repo.outputs.repo_name }}
          DEFAULT_BRANCH: ${{ steps.repo.outputs.default_branch }}
          REPO_URL: ${{ steps.repo.outputs.repo_url }}
        run: |
          echo "Replace this command with your Kimchi retrospective runner invocation."
          echo "Example: kimchi run --mode retrospective --repo ."
          # Placeholder exit to keep the workflow green until configured.
          exit 0

      - name: Upload retrospective logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-retrospective-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .kimchi/logs/*.md
            .kimchi/retrospectives/*.md
          if-no-files-found: ignore
