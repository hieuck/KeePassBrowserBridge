# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

# pull_request_target is used because the labeler only reads .github/labeler.yml
# and inspects file paths in the PR; it does not execute untrusted code from the PR.
name: Labeler
on: [pull_request_target]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        sync-labels: false
