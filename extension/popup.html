<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeePass Browser Bridge</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo">
        <span class="logo-icon">🔑</span>
        <span class="logo-text">KeePass Bridge</span>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="btn-icon" type="button" aria-label="Toggle theme" title="Toggle dark/light mode">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input id="loginSearch" class="search-input" type="search" placeholder="Search vault..." spellcheck="false" aria-label="Search credentials">
      <button id="clearLoginSearch" class="search-clear hidden" type="button">&times;</button>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar hidden" id="filterBar">
      <button class="filter-chip filter-chip-all active" type="button">All</button>
      <div class="filter-chips" id="filterChips"></div>
    </div>

    <!-- State notice -->
    <div id="stateNotice" class="state-notice" aria-live="polite"></div>

    <!-- Current URL -->
    <div id="currentUrl" class="url"></div>

    <!-- Settings panel (collapsible) -->
    <section id="settingsPanel" class="settings-panel hidden">
      <div class="settings-section">
        <label for="endpoint">Bridge endpoint</label>
        <div class="row">
          <input id="endpoint" type="url" spellcheck="false">
          <button id="saveEndpoint" type="button">Save</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="row">
          <button id="checkStatus" type="button">Check</button>
          <button id="beginPair" type="button">Pair</button>
        </div>
        <label class="toggle">
          <input id="autoFill" type="checkbox">
          <span>Auto-fill when exactly one login matches</span>
        </label>
        <label class="toggle">
          <input id="autoSubmit" type="checkbox">
          <span>Auto-submit form after filling</span>
        </label>
        <button id="listClients" class="secondary" type="button">Trusted Browsers</button>
      </div>

      <div class="settings-section">
        <div class="row">
          <button id="toggleSiteAutoFill" class="secondary" type="button">Site Auto-fill</button>
          <button id="toggleSiteAutoSubmit" class="secondary" type="button">Site Auto-submit</button>
        </div>
      </div>

      <div id="clientsPanel" class="clients hidden"></div>

      <div id="pairingPanel" class="pairing hidden">
        <div id="pairingTimer" class="pairing-timer"></div>
        <div class="row">
          <input id="pairingCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="Pairing code">
          <button id="pastePairingCode" class="secondary" type="button">Paste & Pair</button>
          <button id="completePair" type="button">Confirm</button>
          <button id="cancelPair" class="secondary" type="button">Cancel</button>
        </div>
      </div>
    </section>

    <!-- Primary actions -->
    <div class="action-bar">
      <button id="queryLogins" class="btn-primary" type="button">Find Logins</button>
      <button id="newLogin" class="btn-secondary" type="button">+ New Login</button>
      <button id="generatePassword" class="btn-secondary" type="button">🔑</button>
    </div>

    <!-- Vault list -->
    <div class="vault-list" id="results"></div>

    <!-- Detail view -->
    <div class="detail-view hidden">
      <div class="detail-header">
        <button class="detail-back-btn" type="button">← Back</button>
      </div>
      <div class="detail-body">
        <div class="detail-avatar-section">
          <div class="detail-avatar" id="detailAvatar"></div>
          <div>
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-subtitle" id="detailSubtitle"></div>
          </div>
        </div>
        <div class="detail-fields" id="detailFields"></div>
      </div>
      <div class="detail-actions">
        <button class="detail-fill-btn btn-autofill" type="button">✓ Autofill</button>
      </div>
    </div>

    <!-- Password generator panel -->
    <div class="password-generator hidden">
      <div class="gen-header">
        <span>🔑 Password Generator</span>
        <button class="gen-close" type="button">&times;</button>
      </div>
      <div class="gen-password-row">
        <input class="generated-password" type="text" readonly spellcheck="false">
        <button class="gen-refresh-btn" title="Generate new">↻</button>
      </div>
      <div class="gen-options">
        <div class="gen-option">
          <label>Length</label>
          <input class="gen-length" type="range" min="8" max="64" value="20">
          <span class="gen-length-value">20</span>
        </div>
        <div class="gen-option">
          <label><input class="gen-uppercase" type="checkbox" checked> A-Z</label>
        </div>
        <div class="gen-option">
          <label><input class="gen-lowercase" type="checkbox" checked> a-z</label>
        </div>
        <div class="gen-option">
          <label><input class="gen-digits" type="checkbox" checked> 0-9</label>
        </div>
        <div class="gen-option">
          <label><input class="gen-symbols" type="checkbox"> !@#$%</label>
        </div>
      </div>
      <div class="gen-actions">
        <button class="gen-copy-btn btn-copy">📋 Copy</button>
        <button class="gen-fill-btn btn-autofill">⬇ Fill & Close</button>
      </div>
    </div>

    <!-- Passkey section -->
    <section id="passkeySection" class="settings-section passkey-section" style="display:none">
      <div class="section-header">Passkey Support</div>
      <label class="toggle">
        <input id="passkeyToggle" type="checkbox">
        <span>Enable WebAuthn passkeys</span>
      </label>
      <div id="passkeyStatus" class="status-text"></div>
    </section>

    <!-- About section -->
    <section id="aboutPanel" class="settings-section about-section hidden">
      <div class="about-header">
        <div>
          <div class="about-title">About</div>
          <div class="about-meta">Version <span id="aboutVersion">...</span></div>
        </div>
        <button id="checkUpdates" class="secondary" type="button">Check updates</button>
      </div>
      <div class="about-grid">
        <span>Plugin</span>
        <code id="aboutPluginVersion"></code>
        <span>Browser ID</span>
        <code id="aboutBrowserId"></code>
        <a id="repositoryLink" href="#" target="_blank" rel="noreferrer">Repository</a>
        <a id="releasesLink" href="#" target="_blank" rel="noreferrer">GitHub Releases</a>
      </div>
    </section>

    <!-- Status bar -->
    <footer class="status-bar">
      <button id="lockBridge" class="lock-btn" title="Lock vault">
        <span class="lock-icon">🔒</span>
        <span class="lock-status">Lock</span>
      </button>
      <span id="statusBadge" class="vault-status">Checking</span>
      <div class="status-actions">
        <button id="showSettings" class="btn-icon" type="button" title="Settings">⚙</button>
        <button id="showAbout" class="btn-icon" type="button" title="About">ℹ</button>
      </div>
    </footer>

    <div class="loading-overlay hidden">
      <div class="loading-spinner"></div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
